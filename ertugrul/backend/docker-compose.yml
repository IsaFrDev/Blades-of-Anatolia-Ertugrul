version: "3.9"

# Dirilis: The Last March — local meta-services stack.
# Ishga tushirish: docker compose up -d && ./mvnw spring-boot:run -Dspring-boot.run.profiles=local

name: ertugrul-meta

services:

  postgres:
    image: postgres:16-alpine
    container_name: ert-postgres
    environment:
      POSTGRES_DB: ertugrul
      POSTGRES_USER: ertugrul
      POSTGRES_PASSWORD: ertugrul
      # Save blob metadata is write-heavy; keep checksums on for corruption detection.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ertugrul -d ertugrul"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: ert-redis
    # Rate-limit counters and remote-config cache are all reconstructible,
    # so persistence is disabled deliberately (faster, no AOF fsync stalls).
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: bitnami/kafka:3.8
    container_name: ert-kafka
    environment:
      # KRaft mode — no ZooKeeper.
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: "broker,controller"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "29092:29092"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: ert-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ertugrul
      MINIO_ROOT_PASSWORD: ertugrul-secret
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the two buckets the app expects.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: ert-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ertugrul ertugrul-secret &&
      mc mb --ignore-existing local/ertugrul-saves &&
      mc mb --ignore-existing local/ertugrul-exports &&
      mc version enable local/ertugrul-saves &&
      mc anonymous set download local/ertugrul-exports &&
      echo 'buckets ready';
      "
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ert-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ertugrul
      SPRING_DATASOURCE_USERNAME: ertugrul
      SPRING_DATASOURCE_PASSWORD: ertugrul
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ERTUGRUL_S3_ENDPOINT: http://minio:9000
      ERTUGRUL_S3_ACCESS_KEY: ertugrul
      ERTUGRUL_S3_SECRET_KEY: ertugrul-secret
      # Dev-only secrets. Production reads these from the secret manager.
      ERTUGRUL_SECURITY_SAVE_HMAC_SECRET: "dev-only-save-hmac-secret-change-me"
      ERTUGRUL_SECURITY_CLIENT_HMAC_SECRET: "dev-only-client-hmac-secret-change-me"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  kafkadata:
  miniodata:
