server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: true
    # Save blobs are already compressed client-side; only compress JSON/text.
    mime-types: application/json,text/plain,application/xml
    min-response-size: 2KB
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ertugrul-backend

  lifecycle:
    timeout-per-shutdown-phase: 25s

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ertugrul}
    username: ${SPRING_DATASOURCE_USERNAME:ertugrul}
    password: ${SPRING_DATASOURCE_PASSWORD:ertugrul}
    hikari:
      pool-name: ert-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      # Cloud-save upload holds a connection only for metadata; blob I/O is outside the tx.
      leak-detection-threshold: 20000

  jpa:
    open-in-view: false          # never lazy-load in the view layer
    hibernate:
      ddl-auto: validate         # Flyway owns the schema
    properties:
      hibernate:
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        query.in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: "1"                  # telemetry is lossy-tolerant; latency beats durability
      compression-type: lz4
      batch-size: 65536
      properties:
        linger.ms: 50            # batch window — see TelemetryProducer
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 20000
        request.timeout.ms: 8000
    properties:
      spring.json.add.type.headers: false

  servlet:
    multipart:
      # Save blobs are uploaded as raw octet-stream, not multipart, but the
      # Safar Daftari image attachments are.
      max-file-size: 12MB
      max-request-size: 16MB

  threads:
    virtual:
      enabled: true              # Java 21 — S3/Kafka calls are I/O bound

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ertugrul-backend
  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.fayzinc.ertugrul: DEBUG
    org.hibernate.SQL: WARN

# ─────────────────────────────────────────────────────────────────────────────
# Application-specific configuration
# ─────────────────────────────────────────────────────────────────────────────
ertugrul:

  security:
    jwt:
      issuer: https://api.dirilis-game.com
      audience: ertugrul-client
      # Short access token: the client refreshes silently while the player is in a menu.
      access-token-ttl: PT30M
      refresh-token-ttl: P30D
      # RSA keypair for RS256. Generated on boot in local/dev; in production the
      # PEM is injected from the secret manager and rotated via a two-key JWKS.
      private-key-pem: ${ERTUGRUL_JWT_PRIVATE_KEY:}
      public-key-pem: ${ERTUGRUL_JWT_PUBLIC_KEY:}
    # HMAC over save blobs — detects object-store tampering and blob swapping.
    save-hmac-secret: ${ERTUGRUL_SECURITY_SAVE_HMAC_SECRET:dev-only-save-hmac-secret-change-me}
    # Shared with the shipped client. Treated as a SOFT signal only: a secret
    # inside a shipped binary is extractable, so a bad client MAC raises the
    # anti-cheat score but never rejects the save.
    client-hmac-secret: ${ERTUGRUL_SECURITY_CLIENT_HMAC_SECRET:dev-only-client-hmac-secret-change-me}

  s3:
    endpoint: ${ERTUGRUL_S3_ENDPOINT:http://localhost:9000}
    region: ${ERTUGRUL_S3_REGION:us-east-1}
    access-key: ${ERTUGRUL_S3_ACCESS_KEY:ertugrul}
    secret-key: ${ERTUGRUL_S3_SECRET_KEY:ertugrul-secret}
    # MinIO needs path-style; real S3 does not.
    path-style-access: true
    save-bucket: ertugrul-saves
    export-bucket: ertugrul-exports
    presign-ttl: PT15M

  save:
    # 8 manual slots (1..8) + slot 0 reserved for autosave — see 07_SETTINGS_HOTKEYS.md.
    max-manual-slots: 8
    autosave-slot-index: 0
    max-blob-bytes: 8388608      # 8 MiB hard ceiling per blob
    # Versions kept per slot. Older versions are pruned by a nightly job; keeping
    # a tail lets support restore a save a player corrupted.
    retained-versions-per-slot: 10
    # A save the client claims is newer than this much clock skew is rejected.
    max-clock-skew: PT10M

  telemetry:
    topic: ert.telemetry.raw
    dlq-topic: ert.telemetry.rejected
    max-batch-size: 200
    # Events older than this are dropped (offline client replaying a stale spool).
    max-event-age: P3D

  liveops:
    remote-config-cache-ttl: PT60S
    # Cohort bucketing salt. Changing this reshuffles every A/B assignment —
    # never change it mid-experiment.
    cohort-salt: ${ERTUGRUL_COHORT_SALT:dirilis-2026}
    codex-cdn-base-url: https://cdn.dirilis-game.com/codex

  ratelimit:
    enabled: true
    # Per-route-class token buckets, keyed by player (or IP when unauthenticated).
    auth-per-minute: 10
    save-upload-per-minute: 20
    telemetry-per-minute: 120
    default-per-minute: 300

  journey:
    max-entries-per-player: 2000
    share-link-ttl: P90D
    export-ttl: P7D

---
# ── Local profile: in-memory-ish, verbose ────────────────────────────────────
spring:
  config:
    activate:
      on-profile: local
  jpa:
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

---
# ── Docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker
logging:
  level:
    com.fayzinc.ertugrul: INFO
